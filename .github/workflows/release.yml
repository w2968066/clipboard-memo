name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # 仓库里没有 assets/icon.png，config.json 被 .gitignore 排除，
      # 不能用 --icon / --add-data 引用；托盘图标有代码兜底，
      # config.json 首次运行时自动生成在 exe 旁边
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name ClipboardMemo --hidden-import pystray._win32 main.py

      - name: Smoke test
        shell: pwsh
        run: |
          Start-Process dist\ClipboardMemo.exe
          Start-Sleep -Seconds 8
          $p = Get-Process ClipboardMemo -ErrorAction SilentlyContinue
          if (-not $p) { Write-Error "exe crashed on startup"; exit 1 }
          Stop-Process -Name ClipboardMemo -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardMemo
          path: dist/ClipboardMemo.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipboardMemo

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipboardMemo ${{ github.ref_name }}
          body: |
            ## 剪贴板备忘录 ${{ github.ref_name }}

            极简本地剪贴板管理工具，专为 AI 用户设计。

            ### 使用方式
            1. 下载 `ClipboardMemo.exe`（绿色便携版，无需安装）
            2. 双击运行，托盘自动启动
            3. 按 `Ctrl+Alt+V` 呼出浮窗（可在设置中修改）
            4. 复制文本/截图，自动记录

            > 数据（config.json、data/）保存在 exe 所在目录，
            > 建议放到单独的文件夹中运行。

            ### 校验
            ```
            sha256sum ClipboardMemo.exe
            ```
          files: ClipboardMemo.exe
          generate_release_notes: true
          draft: false
          prerelease: false
