name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name ClipboardMemo --icon assets/icon.png --add-data "config.json;." main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardMemo
          path: dist/ClipboardMemo.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipboardMemo

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipboardMemo ${{ github.ref_name }}
          body: |
            ## 剪贴板备忘录 ${{ github.ref_name }}

            极简本地剪贴板管理工具，专为 AI 用户设计。

            ### 使用方式
            1. 下载 `ClipboardMemo.exe`
            2. 双击运行，托盘自动启动
            3. 按 `Ctrl+Shift+V` 呼出浮窗
            4. 复制文本/截图，自动记录

            ### 变更
            查看 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### 校验
            ```
            sha256sum ClipboardMemo.exe
            ```
          files: ClipboardMemo.exe
          draft: false
          prerelease: false
